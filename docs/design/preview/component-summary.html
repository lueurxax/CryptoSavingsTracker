<!doctype html>
<html><head><meta charset="utf-8"><title>Summary card</title>
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="_glass.css">
<style>
  .summary {
    border-radius: 20px;
    padding: 18px 20px;
    width: 300px;
  }
  .label { font: 600 12px var(--font-sans); color: var(--fg-2); text-transform: uppercase; letter-spacing:.06em; }
  .amt { font: 700 34px var(--font-sans); letter-spacing:-0.02em; font-variant-numeric: tabular-nums; color: var(--fg-1); margin-top: 4px; }
  .delta-up { color:#00643E; font:600 13px var(--font-sans); }
  .sub { font: 500 13px var(--font-sans); color: var(--fg-2); }
  .sparkline path { fill:none; stroke:#0066CC; stroke-width:2.25; stroke-linecap:round; stroke-linejoin:round; }
  .sparkline .fill { fill: rgba(0,102,204,0.18); stroke: none; }

  .track {
    height: 8px; border-radius: 999px;
    margin-top: 10px; overflow: hidden;
    background: rgba(255,255,255,0.35);
    box-shadow: inset 0 1px 2px rgba(0,40,90,0.08);
  }
  .fill-bar {
    height: 100%;
    background: linear-gradient(180deg, rgba(0,122,204,0.85), rgba(0,82,170,0.95));
    border-radius: 999px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 0 12px rgba(0,102,204,0.35);
  }
</style>
</head>
<body class="glass">
<div class="row gap-3 wrap">
  <div class="summary glass-surface">
    <div class="label">Total saved</div>
    <div class="amt">$142,505.18</div>
    <div class="row gap-2" style="align-items:center; margin-top:2px">
      <span class="delta-up">▲ $4,210.00</span>
      <span class="sub">last 30 days</span>
    </div>
    <svg class="sparkline" viewBox="0 0 260 40" width="100%" height="40" style="margin-top:8px">
      <path class="fill" d="M 0 32 L 25 30 L 50 26 L 75 28 L 100 22 L 125 18 L 150 20 L 175 14 L 200 10 L 225 12 L 260 6 L 260 40 L 0 40 Z"/>
      <path d="M 0 32 L 25 30 L 50 26 L 75 28 L 100 22 L 125 18 L 150 20 L 175 14 L 200 10 L 225 12 L 260 6"/>
    </svg>
  </div>
  <div class="summary glass-surface">
    <div class="label">This month</div>
    <div class="amt">$620.00 <span style="font-size:17px; color:var(--fg-2); font-weight:500">/ $800</span></div>
    <div class="sub" style="margin-top:2px">77% of monthly plan · 12 days left</div>
    <div class="track"><div class="fill-bar" style="width:77%"></div></div>
  </div>
</div>
</body></html>
