<!doctype html>
<html><head><meta charset="utf-8"><title>Tab bar</title>
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="_glass.css">
<style>
  .tabbar {
    border-radius: 22px;
    padding: 10px 14px;
    display: flex;
    justify-content: space-around;
    gap: 4px;
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 14px; min-width: 64px;
    border-radius: 14px;
    cursor: pointer;
    color: rgba(60,60,67,0.55);
    transition: color 180ms, background 180ms;
    position: relative;
    isolation: isolate;
  }
  .tab svg { width:24px; height:24px; stroke-width:2; fill:none; stroke:currentColor; }
  .tab-label { font: 600 11px var(--font-sans); letter-spacing: -0.1px; }

  /* Active pill — a nested glass pill in primary tint */
  .tab.active {
    color: #0066CC;
    background: linear-gradient(180deg, rgba(0,122,204,0.16), rgba(0,82,170,0.22));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.55),
      inset 0 -1px 0 rgba(0,60,140,0.05),
      0 1px 2px rgba(0,60,140,0.10);
    border: 0.5px solid rgba(0,122,204,0.18);
  }
  .tab.active svg { stroke: #0066CC; }
  .tab.active svg circle, .tab.active svg rect { fill: rgba(0,102,204,0.14); }
</style>
</head>
<body class="glass">
<div class="col gap-3">
  <div class="tabbar glass-surface">
    <div class="tab active">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 4 A8 8 0 0 1 19 12" stroke-width="2.5" stroke-linecap="round"/></svg>
      <span class="tab-label">Goals</span>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4" stroke-linecap="round"/></svg>
      <span class="tab-label">Plan</span>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 7h7v7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="tab-label">Forecast</span>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span class="tab-label">Profile</span>
    </div>
  </div>
  <div><span class="caption-pill">Liquid Glass bar — blurred translucent surface. Active tab = nested glass pill tinted primary. Always shows labels.</span></div>
</div>
</body></html>
